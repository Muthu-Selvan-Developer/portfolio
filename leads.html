<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Google Sheet Data Dashboard</title>
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f7fc;
      padding: 30px;
      color: #222;
    }

    .container {
      max-width: 1200px;
      margin: auto;
    }

    .header {
      background: white;
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.05);
      margin-bottom: 20px;
    }

    .header h1 {
      font-size: 28px;
      margin-bottom: 10px;
    }

    .header p {
      color: #666;
    }

    .search-box {
      margin: 20px 0;
    }

    .search-box input {
      width: 100%;
      padding: 14px 18px;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
      background: white;
    }

    .table-card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.05);
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 900px;
    }

    th {
      text-align: left;
      padding: 14px;
      background: #f8fafc;
      border-bottom: 1px solid #eee;
      font-size: 14px;
    }

    td {
      padding: 14px;
      border-bottom: 1px solid #eee;
      font-size: 14px;
    }

    tr:hover {
      background: #fafcff;
    }

    .loading {
      text-align: center;
      padding: 30px;
      color: #666;
    }

    @media (max-width: 768px) {
      body {
        padding: 15px;
      }

      .header h1 {
        font-size: 22px;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>Google Sheet Data Dashboard</h1>
    <p>Live data fetched from Google Sheets with modern responsive UI</p>
  </div>

  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Search data here...">
  </div>

  <div class="table-card">
    <iframe
      src="https://docs.google.com/spreadsheets/d/e/2PACX-1vR9wPuMRM-VQDkJaCel9Ew2BIePOU90toBUA5xEJhTskGrqcaDq94AQ9VHI7DCMo-8V0kldyPywmNSl/pubhtml?widget=true&headers=false"
      width="100%"
      height="700"
      style="border: none; border-radius: 12px; background: white;"
      loading="lazy">
    </iframe>
  </div>
</div>

</body>
</html>
