<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Google Sheet Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #f4f6fb;
    color: #1a1a2e;
    min-height: 100vh;
  }

  /* HEADER */
  .header {
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 60%, #0f3460 100%);
    color: #fff;
    padding: 2rem 2.5rem 1.5rem;
    display: flex;
    align-items: center;
    gap: 1rem;
    box-shadow: 0 4px 24px rgba(0,0,0,0.18);
  }
  .header-icon {
    width: 48px; height: 48px;
    background: rgba(255,255,255,0.12);
    border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    font-size: 24px;
  }
  .header-text h1 { font-size: 1.4rem; font-weight: 700; letter-spacing: -0.3px; }
  .header-text p { font-size: 0.82rem; opacity: 0.6; margin-top: 2px; }

  /* CONTROLS */
  .controls {
    background: #fff;
    border-bottom: 1px solid #e8eaf0;
    padding: 0.85rem 2.5rem;
    display: flex;
    align-items: center;
    gap: 1rem;
    flex-wrap: wrap;
  }
  .controls input[type="text"] {
    flex: 1; min-width: 200px; max-width: 340px;
    padding: 0.48rem 0.9rem;
    border: 1.5px solid #dde1f0;
    border-radius: 8px;
    font-size: 0.88rem;
    color: #1a1a2e;
    background: #f8f9fd;
    outline: none;
    transition: border 0.2s;
  }
  .controls input[type="text"]:focus { border-color: #4c6ef5; background: #fff; }
  .controls select {
    padding: 0.48rem 0.9rem;
    border: 1.5px solid #dde1f0;
    border-radius: 8px;
    font-size: 0.88rem;
    background: #f8f9fd;
    color: #1a1a2e;
    outline: none;
    cursor: pointer;
  }
  .row-count {
    margin-left: auto;
    font-size: 0.8rem;
    color: #888;
    white-space: nowrap;
  }

  /* STATS CARDS */
  .stats-bar {
    display: flex;
    gap: 1rem;
    padding: 1.2rem 2.5rem 0;
    flex-wrap: wrap;
  }
  .stat-card {
    background: #fff;
    border-radius: 12px;
    border: 1px solid #e8eaf0;
    padding: 0.9rem 1.4rem;
    flex: 1; min-width: 130px;
    box-shadow: 0 1px 6px rgba(0,0,0,0.04);
  }
  .stat-card .label { font-size: 0.73rem; color: #888; text-transform: uppercase; letter-spacing: 0.6px; }
  .stat-card .value { font-size: 1.6rem; font-weight: 700; color: #1a1a2e; margin-top: 4px; }
  .stat-card .sub { font-size: 0.75rem; color: #4c6ef5; margin-top: 2px; }

  /* TABLE AREA */
  .table-wrap {
    margin: 1.2rem 2.5rem 2.5rem;
    background: #fff;
    border-radius: 14px;
    border: 1px solid #e8eaf0;
    box-shadow: 0 2px 12px rgba(0,0,0,0.05);
    overflow: hidden;
  }
  .table-scroll { overflow-x: auto; }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.875rem;
  }
  thead tr {
    background: linear-gradient(90deg, #f0f3ff 0%, #f7f8fd 100%);
    border-bottom: 2px solid #e0e4f5;
  }
  th {
    padding: 0.75rem 1rem;
    text-align: left;
    font-weight: 600;
    color: #3d4575;
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    white-space: nowrap;
    cursor: pointer;
    user-select: none;
    position: relative;
  }
  th:hover { background: #e8eeff; }
  th .sort-icon { margin-left: 4px; opacity: 0.5; font-size: 0.7rem; }
  th.sorted .sort-icon { opacity: 1; color: #4c6ef5; }
  tbody tr {
    border-bottom: 1px solid #f0f2fa;
    transition: background 0.12s;
  }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: #f5f7ff; }
  td {
    padding: 0.68rem 1rem;
    color: #2d3250;
    max-width: 220px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .row-num {
    color: #bbb;
    font-size: 0.75rem;
    text-align: center;
    width: 36px;
    padding: 0.68rem 0.4rem;
  }

  /* BADGES for first column values */
  .badge {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 20px;
    font-size: 0.73rem;
    font-weight: 600;
  }

  /* LOADING / ERROR */
  .status-box {
    text-align: center;
    padding: 4rem 2rem;
    color: #888;
  }
  .status-box .spinner {
    width: 40px; height: 40px;
    border: 3px solid #e8eaf0;
    border-top-color: #4c6ef5;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 1rem;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .status-box.error { color: #e05252; }
  .status-box.error .icon { font-size: 2.5rem; margin-bottom: 0.5rem; }

  /* PAGINATION */
  .pagination {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 1rem;
    border-top: 1px solid #f0f2fa;
    flex-wrap: wrap;
  }
  .page-btn {
    padding: 5px 12px;
    border-radius: 7px;
    border: 1.5px solid #dde1f0;
    background: #fff;
    font-size: 0.82rem;
    color: #3d4575;
    cursor: pointer;
    transition: all 0.15s;
  }
  .page-btn:hover { background: #f0f3ff; border-color: #4c6ef5; }
  .page-btn.active { background: #4c6ef5; color: #fff; border-color: #4c6ef5; font-weight: 600; }
  .page-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  @media (max-width: 600px) {
    .header, .controls, .stats-bar, .table-wrap { padding-left: 1rem; padding-right: 1rem; }
    .stats-bar { padding: 1rem 1rem 0; }
    .table-wrap { margin: 1rem; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-icon">📊</div>
  <div class="header-text">
    <h1>Google Sheet Dashboard</h1>
    <p id="sheet-url-label">Loading data...</p>
  </div>
</div>

<div class="stats-bar" id="stats-bar" style="display:none"></div>

<div class="controls" id="controls" style="display:none">
  <input type="text" id="search-box" placeholder="🔍  Search across all columns..." oninput="applyFilters()" />
  <select id="col-filter-select" onchange="applyFilters()">
    <option value="">All columns</option>
  </select>
  <select id="per-page" onchange="applyFilters()">
    <option value="20">20 / page</option>
    <option value="50">50 / page</option>
    <option value="100">100 / page</option>
    <option value="99999">All</option>
  </select>
  <span class="row-count" id="row-count"></span>
</div>

<div class="table-wrap" id="table-wrap">
  <div class="status-box" id="status-box">
    <div class="spinner"></div>
    <p>Fetching your Google Sheet...</p>
  </div>
</div>

<script>
const SHEET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vR9wPuMRM-VQDkJaCel9Ew2BIePOU90toBUA5xEJhTskGrqcaDq94AQ9VHI7DCMo-8V0kldyPywmNSl/pub?output=csv";
const CORS_PROXY = "https://corsproxy.io/?";

let allData = [], headers = [], filtered = [], currentPage = 1, sortCol = -1, sortDir = 1;

const BADGE_COLORS = [
  ['#e8f0ff','#3d5bd9'],['#e8f7ee','#2a7a4a'],['#fff3e8','#b85c00'],
  ['#fce8f3','#9c2d6a'],['#e8f5fb','#1a7fa0'],['#f3e8ff','#6b2da8'],
  ['#fef3e8','#8a5700'],['#e8fef5','#1a7a5a']
];
const colorMap = {};
let colorIdx = 0;
function badgeColor(val) {
  if (!colorMap[val]) { colorMap[val] = BADGE_COLORS[colorIdx % BADGE_COLORS.length]; colorIdx++; }
  return colorMap[val];
}

async function loadSheet() {
  try {
    const res = await fetch(CORS_PROXY + encodeURIComponent(SHEET_URL));
    if (!res.ok) throw new Error("HTTP " + res.status);
    const csv = await res.text();
    Papa.parse(csv, {
      header: true, skipEmptyLines: true,
      complete: ({ data, meta }) => {
        headers = meta.fields || [];
        allData = data;
        init();
      },
      error: e => showError("CSV parse error: " + e.message)
    });
  } catch (e) {
    showError("Could not load sheet. " + e.message);
  }
}

function showError(msg) {
  document.getElementById('status-box').innerHTML =
    `<div class="icon">⚠️</div><p><b>Error</b></p><p style="margin-top:8px;font-size:0.85rem">${msg}</p>
     <p style="margin-top:16px;font-size:0.8rem;color:#aaa">Make sure the sheet is published to web (File → Share → Publish to web → CSV)</p>`;
  document.getElementById('status-box').classList.add('error');
}

function init() {
  document.getElementById('sheet-url-label').textContent = `${allData.length} rows · ${headers.length} columns`;
  buildStats();
  buildColFilter();
  document.getElementById('controls').style.display = 'flex';
  applyFilters();
}

function buildStats() {
  const bar = document.getElementById('stats-bar');
  bar.style.display = 'flex';
  const totalRows = allData.length;
  const totalCols = headers.length;
  let cards = `
    <div class="stat-card"><div class="label">Total Rows</div><div class="value">${totalRows.toLocaleString()}</div></div>
    <div class="stat-card"><div class="label">Columns</div><div class="value">${totalCols}</div></div>`;

  // Try to find a numeric column for sum
  for (const h of headers) {
    const nums = allData.map(r => parseFloat(r[h])).filter(n => !isNaN(n));
    if (nums.length > totalRows * 0.5) {
      const sum = nums.reduce((a,b) => a+b, 0);
      cards += `<div class="stat-card"><div class="label">Sum of ${h}</div><div class="value">${sum.toLocaleString(undefined,{maximumFractionDigits:2})}</div><div class="sub">across ${nums.length} rows</div></div>`;
      const avg = sum / nums.length;
      cards += `<div class="stat-card"><div class="label">Avg ${h}</div><div class="value">${avg.toLocaleString(undefined,{maximumFractionDigits:2})}</div></div>`;
      break;
    }
  }
  bar.innerHTML = cards;
}

function buildColFilter() {
  const sel = document.getElementById('col-filter-select');
  headers.forEach(h => { const o = document.createElement('option'); o.value = h; o.textContent = h; sel.appendChild(o); });
}

function applyFilters() {
  const q = document.getElementById('search-box').value.trim().toLowerCase();
  const col = document.getElementById('col-filter-select').value;
  filtered = allData.filter(row => {
    const haystack = col ? (row[col]||'').toLowerCase() : Object.values(row).join(' ').toLowerCase();
    return !q || haystack.includes(q);
  });
  if (sortCol >= 0) {
    filtered.sort((a, b) => {
      const av = a[headers[sortCol]] || '', bv = b[headers[sortCol]] || '';
      const an = parseFloat(av), bn = parseFloat(bv);
      if (!isNaN(an) && !isNaN(bn)) return (an - bn) * sortDir;
      return av.localeCompare(bv) * sortDir;
    });
  }
  currentPage = 1;
  render();
}

function render() {
  const perPage = parseInt(document.getElementById('per-page').value);
  const totalPages = Math.max(1, Math.ceil(filtered.length / perPage));
  if (currentPage > totalPages) currentPage = totalPages;
  const start = (currentPage - 1) * perPage;
  const pageRows = filtered.slice(start, start + perPage);

  document.getElementById('row-count').textContent =
    `${filtered.length.toLocaleString()} of ${allData.length.toLocaleString()} rows`;

  const isFirstColCategorical = headers.length && allData.slice(0,20).every(r => {
    const v = r[headers[0]] || '';
    return isNaN(parseFloat(v)) && v.length < 40;
  });

  let thead = '<tr><th class="row-num">#</th>';
  headers.forEach((h, i) => {
    const icon = sortCol === i ? (sortDir === 1 ? '▲' : '▼') : '⇅';
    const cls = sortCol === i ? 'sorted' : '';
    thead += `<th class="${cls}" onclick="sortBy(${i})">${h} <span class="sort-icon">${icon}</span></th>`;
  });
  thead += '</tr>';

  let tbody = '';
  if (pageRows.length === 0) {
    tbody = `<tr><td colspan="${headers.length+1}" style="text-align:center;padding:2.5rem;color:#aaa;">No matching rows found.</td></tr>`;
  } else {
    pageRows.forEach((row, idx) => {
      tbody += `<tr><td class="row-num">${start + idx + 1}</td>`;
      headers.forEach((h, ci) => {
        const val = row[h] !== undefined ? row[h] : '';
        if (ci === 0 && isFirstColCategorical && val) {
          const [bg, fg] = badgeColor(val);
          tbody += `<td><span class="badge" style="background:${bg};color:${fg}">${val}</span></td>`;
        } else {
          tbody += `<td title="${val.toString().replace(/"/g,'&quot;')}">${val}</td>`;
        }
      });
      tbody += '</tr>';
    });
  }

  // Pagination
  let pages = '';
  const maxBtns = 7;
  let start2 = Math.max(1, currentPage - 3), end2 = Math.min(totalPages, start2 + maxBtns - 1);
  if (end2 - start2 < maxBtns - 1) start2 = Math.max(1, end2 - maxBtns + 1);
  if (start2 > 1) pages += `<button class="page-btn" onclick="goPage(1)">1</button>${start2 > 2 ? '<span style="color:#aaa">…</span>' : ''}`;
  for (let p = start2; p <= end2; p++) {
    pages += `<button class="page-btn ${p===currentPage?'active':''}" onclick="goPage(${p})">${p}</button>`;
  }
  if (end2 < totalPages) pages += `${end2 < totalPages-1 ? '<span style="color:#aaa">…</span>' : ''}<button class="page-btn" onclick="goPage(${totalPages})">${totalPages}</button>`;

  const pagination = totalPages > 1 ? `<div class="pagination">
    <button class="page-btn" onclick="goPage(${currentPage-1})" ${currentPage===1?'disabled':''}>‹ Prev</button>
    ${pages}
    <button class="page-btn" onclick="goPage(${currentPage+1})" ${currentPage===totalPages?'disabled':''}>Next ›</button>
  </div>` : '';

  document.getElementById('table-wrap').innerHTML = `
    <div class="table-scroll">
      <table>
        <thead>${thead}</thead>
        <tbody>${tbody}</tbody>
      </table>
    </div>
    ${pagination}`;
}

function sortBy(colIdx) {
  if (sortCol === colIdx) sortDir *= -1;
  else { sortCol = colIdx; sortDir = 1; }
  render();
}

function goPage(p) {
  const perPage = parseInt(document.getElementById('per-page').value);
  const totalPages = Math.ceil(filtered.length / perPage);
  currentPage = Math.max(1, Math.min(p, totalPages));
  render();
}

loadSheet();
</script>
</body>
</html>
